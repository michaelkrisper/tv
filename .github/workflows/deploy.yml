name: Deploy

# Baut die 20:15-Daten aus dem EPG und veröffentlicht alles auf GitHub Pages.
# Läuft bei jedem Push und zweimal täglich, weil jeden Tag ein neuer Tag
# dazukommt und sich das Programm kurzfristig ändern kann.

on:
  push:
    branches: [main]
  schedule:
    - cron: '15 3 * * *' # 05:15 MESZ / 04:15 MEZ
    - cron: '15 14 * * *' # 16:15 MESZ – vor dem Abend noch einmal
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  actions: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run check

      # Zugeschnittene Senderlogos zwischen den Läufen behalten.
      - uses: actions/cache@v6
        with:
          path: .cache
          key: logo-${{ github.run_id }}
          restore-keys: logo-

      # Token nur für die GitHub-API (Verzeichnis der Senderlogos), sonst greift
      # das Limit für anonyme Abrufe von geteilten Runner-Adressen.
      - run: npm run build
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist
      - id: pages
        uses: actions/deploy-pages@v5

      - name: Nachsehen
        run: |
          set -euo pipefail
          live="${{ steps.pages.outputs.page_url }}"
          for f in "" data/list.json sw.js manifest.webmanifest; do
            for versuch in 1 2 3 4 5; do
              code="$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 "$live$f" || echo 000)"
              [ "$code" = 200 ] && break
              sleep 5
            done
            echo "/$f -> $code"
            [ "$code" = 200 ] || { echo "::error::/$f antwortet mit $code"; exit 1; }
          done

      # GitHub legt geplante Workflows in öffentlichen Repos nach 60 Tagen ohne
      # Commit still. Das erneute Aktivieren setzt die Frist zurück.
      - if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/deploy.yml/enable"

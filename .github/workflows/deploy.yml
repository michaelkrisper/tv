name: Deploy

# Runs the CI workflow (lint, unit tests) first; only then builds the
# programme data from the EPG and tests the app in the browser. Every tested
# commit on main gets the next patch version tag, and the own server
# (https://tv.krisperapps.de/) is told to build that version. Any failing step
# stops the deploy. Pull requests are only built and tested, never deployed.
# Fresh programme data twice a day comes from the server's own timer.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.event_name == 'pull_request' && github.ref || 'deploy' }}
  cancel-in-progress: false

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # tags for the version shown in the app
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci

      # Keep the trimmed channel logos between runs.
      - uses: actions/cache@v6
        with:
          path: .cache
          key: logo-${{ github.run_id }}
          restore-keys: logo-

      # Token only for the GitHub API (channel logo index); otherwise the
      # anonymous rate limit of shared runner addresses applies.
      # The version job tags only after the tests; the app shows the same version.
      - id: version
        if: github.event_name != 'pull_request'
        run: python3 .github/scripts/release.py next
      - run: npm run build
        env:
          GITHUB_TOKEN: ${{ github.token }}
          APP_VERSION: ${{ steps.version.outputs.version }}

      # Browser tests against the finished build before the version is tagged.
      - id: playwright
        run: echo "version=$(npx playwright --version | cut -d' ' -f2)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ steps.playwright.outputs.version }}
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7

  # Tags every tested commit on main with the next patch version (vX.Y.Z).
  version:
    name: Version tag
    needs: [test, build]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: version-tag
      cancel-in-progress: false
    outputs:
      version: ${{ steps.tag.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: tag
        run: python3 .github/scripts/release.py tag
        env:
          GH_TOKEN: ${{ github.token }}

  # The own server builds the guide itself and refreshes the data on its own
  # timer (https://tv.krisperapps.de/). This only tells it that a new version
  # exists; the key can do nothing but start that build.
  # Only commits that got a version tag: a re-run of an older run deploys nothing.
  server:
    name: krisperapps.de
    needs: [build, version]
    if: needs.version.outputs.version != ''
    runs-on: ubuntu-latest
    steps:
      - name: Rebuild on the server
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy
          chmod 600 ~/.ssh/deploy
          echo 'krisperapps.de ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIMchrlhQI1OFJ2cEfQosiydiSPg498c/+Mggebk+zVLO' > ~/.ssh/known_hosts
          ssh -i ~/.ssh/deploy tv@krisperapps.de

      - name: Check live site
        run: |
          set -euo pipefail
          live="https://tv.krisperapps.de/"
          for f in "" data/list.json sw.js manifest.webmanifest; do
            for attempt in 1 2 3 4 5; do
              code="$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 "$live$f" || echo 000)"
              [ "$code" = 200 ] && break
              sleep 5
            done
            echo "/$f -> $code"
            [ "$code" = 200 ] || { echo "::error::/$f responded with $code"; exit 1; }
          done

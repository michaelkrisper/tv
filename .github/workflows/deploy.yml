name: Deploy

# Runs the CI workflow (lint, unit tests) first; only then builds the
# programme data from the EPG, tests the app in the browser and deploys
# everything to GitHub Pages. Any failing step stops the deploy. Runs on every
# push to main and twice daily: each day adds a new day, and short-notice
# changes for the evening are usually known by 18:00.
# Pull requests are only built and tested, never deployed.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Cron is UTC only: 18:00 CEST, 17:00 CET in winter.
    - cron: '0 16 * * *'
    # After midnight (01:30 CEST / 00:30 CET), otherwise the third day is missing until 18:00.
    - cron: '30 23 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.event_name == 'pull_request' && github.ref || 'pages' }}
  cancel-in-progress: false

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
      actions: write
    environment:
      name: ${{ github.event_name != 'pull_request' && 'github-pages' || '' }}
      url: ${{ steps.pages.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci

      # Keep the trimmed channel logos between runs.
      - uses: actions/cache@v6
        with:
          path: .cache
          key: logo-${{ github.run_id }}
          restore-keys: logo-

      # Token only for the GitHub API (channel logo index); otherwise the
      # anonymous rate limit of shared runner addresses applies.
      - run: npm run build
        env:
          GITHUB_TOKEN: ${{ github.token }}

      # Browser tests against the finished build before it is deployed.
      - id: playwright
        run: echo "version=$(npx playwright --version | cut -d' ' -f2)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ steps.playwright.outputs.version }}
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7

      - uses: actions/upload-pages-artifact@v5
        if: github.event_name != 'pull_request'
        with:
          path: dist
      - id: pages
        if: github.event_name != 'pull_request'
        uses: actions/deploy-pages@v5

      - name: Check live site
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          live="${{ steps.pages.outputs.page_url }}"
          for f in "" data/list.json sw.js manifest.webmanifest; do
            for attempt in 1 2 3 4 5; do
              code="$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 "$live$f" || echo 000)"
              [ "$code" = 200 ] && break
              sleep 5
            done
            echo "/$f -> $code"
            [ "$code" = 200 ] || { echo "::error::/$f responded with $code"; exit 1; }
          done

      # GitHub disables scheduled workflows in public repos after 60 days
      # without a commit. Re-enabling resets the timer.
      - if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/deploy.yml/enable"

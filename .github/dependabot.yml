# Weekly updates for actions and npm packages. Minor and patch updates are
# grouped into one pull request per ecosystem; major updates arrive one by one.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # Majors included: separate PRs on the same workflow file block each other's auto-merge.
    groups:
      actions:
        patterns: ['*']

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      npm-minor-patch:
        patterns: ['*']
        update-types: [minor, patch]

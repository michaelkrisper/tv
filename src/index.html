<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">

<title>TV – Was läuft jetzt und um 20:15?</title>
<meta name="description" content="Was jetzt und heute um 20:15 im Fernsehen läuft – auf einen Blick.">
<meta name="theme-color" content="#101218">
<script>
// Hell/Dunkel vor dem ersten Zeichnen setzen, sonst blitzt das falsche auf.
// "auto" folgt dem Betriebssystem, auch wenn es sich dort umstellt.
function applyTheme(){let p='auto';try{p=localStorage.getItem('tv.theme')||p}catch{}const t=p==='light'||p==='dark'?p:matchMedia('(prefers-color-scheme: light)').matches?'light':'dark';document.documentElement.dataset.theme=t;document.querySelector('meta[name=theme-color]').content=t==='light'?'#f4f5f8':'#101218';return p}
applyTheme();matchMedia('(prefers-color-scheme: light)').addEventListener('change',applyTheme);
</script>
<link rel="preload" href="data/list.json" as="fetch" crossorigin>
<link rel="preconnect" href="https://wsrv.nl" crossorigin>
<link rel="manifest" href="manifest.webmanifest">

<style>
:root{--top:env(safe-area-inset-top)}
:root{--bg:#101218;--card:#191c24;--line:#262a35;--fg:#eceef3;--dim:#9097a8;--acc:#ffb547;--r:12px;color-scheme:dark}
[data-theme=light]{--bg:#f4f5f8;--card:#fff;--line:#e2e4ea;--fg:#15171c;--dim:#5d6475;--acc:#c46a00;color-scheme:light}
*{box-sizing:border-box;margin:0}
/* Das Dokument scrollt nie, nur die Liste. */
html,body{height:100%;overflow:hidden}
html{-webkit-text-size-adjust:100%;touch-action:pan-x pan-y;overscroll-behavior:none}
body{display:flex;flex-direction:column;background:var(--bg);color:var(--fg);font:16px/1.35 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-tap-highlight-color:transparent;overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.dt p,.dt .sub,.cast{-webkit-user-select:text;user-select:text}
img{-webkit-user-drag:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
:focus:not(:focus-visible),dialog:focus{outline:none}
/* Navigation unten (Material 3) auf allen Plattformen: volle Breite, bündig
   unten, flach ohne Milchglas; Auswahl als Pille. */
/* Statusleiste: deckender fixed-Streifen über die volle Breite. Nur dann zeichnet
   iOS 26 dort keinen Weichzeichner, sondern füllt sie mit dieser Farbe
   (WebKit: fixedContainerEdges; mehr als 10 px hoch, mind. 90 % breit). */
.edge{position:fixed;z-index:3;top:0;left:0;right:0;height:env(safe-area-inset-top);background:var(--bg);pointer-events:none}
.tabs{position:fixed;z-index:2;left:0;right:0;bottom:0;display:flex;align-items:center;gap:4px;height:calc(64px + env(safe-area-inset-bottom));padding:0 8px env(safe-area-inset-bottom) 12px;background:color-mix(in srgb,var(--card) 60%,var(--bg))}
.days{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;flex:1;min-width:0}
.days::-webkit-scrollbar{display:none}
.days button{padding:8px 14px;border-radius:99px;font-size:14px;font-weight:500;white-space:nowrap}
.days button[aria-pressed=true]{background:var(--acc);border-color:var(--acc);color:#111;font-weight:600}
.days .now::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:#ff4d4d;margin-right:5px;vertical-align:1px;animation:live 2.4s ease-in-out infinite}
@keyframes live{0%,100%{opacity:1;box-shadow:0 0 0 0 #ff4d4d66}50%{opacity:.55;box-shadow:0 0 0 3px #ff4d4d00}}
.icon{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;flex:none}
.icon svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
main{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;scrollbar-width:none;touch-action:pan-y;padding:calc(var(--top) + 6px) max(4px,calc((100% - 760px) / 2)) calc(64px + env(safe-area-inset-bottom) + 8px)}
main::-webkit-scrollbar{display:none}
.row{position:relative;display:grid;grid-template-columns:96px minmax(0,1fr);gap:10px;align-items:center;width:100%;text-align:left;padding:4px;border-radius:var(--r);transition:transform .12s,background-color .12s}
.row:active{background:var(--card);transform:scale(.985)}
@media (hover:hover){.row:hover{background:var(--card)}}
.tw{position:relative;border-radius:8px}
.th{width:96px;height:auto;aspect-ratio:16/9;border-radius:8px;background:var(--card);object-fit:cover;display:block}
/* Bilder weich einblenden statt aufploppen */
img.th,img.hero{opacity:0;transition:opacity .2s}
img.ok{opacity:1}
.badge{position:absolute;left:0;top:0;max-width:100%;padding:2px 5px;border-radius:8px 0 6px 0;background:#000b;color:#fff;font-size:10px;font-weight:700;letter-spacing:.3px;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* Logos transparent auf dem Bild: Schatten und eine abgedunkelte Ecke tragen
   weiße und farbige Logos; fast schwarze (k) bekommen einen hellen Schein. */
.lg{position:absolute;z-index:1;left:4px;top:4px;display:flex;align-items:center;height:16px}
.lg img{height:100%;width:auto;max-width:58px;object-fit:contain;object-position:left center;display:block;filter:drop-shadow(0 0 1px #000a) drop-shadow(0 1px 3px #000c)}
.lg.k img{filter:drop-shadow(0 0 1px #fffc) drop-shadow(0 0 4px #fffa)}
.tw.sc::after{content:"";position:absolute;inset:0;border-radius:8px;background:radial-gradient(110% 80% at 0 0,#000a,transparent 60%);pointer-events:none}
/* Fortschritt über die ganze Zeile, unten im Rand der Zeile. */
.pg{position:absolute;left:4px;right:4px;bottom:0;height:3px;background:var(--line);border-radius:2px;overflow:hidden}
.pg i{display:block;height:100%;background:#ff4d4d}
.pg[hidden]{display:none}
.t{display:block;font-weight:650;font-size:16px;line-height:1.25;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.m{font-size:12.5px;line-height:1.3;color:var(--dim);font-variant-numeric:tabular-nums}
.nw{white-space:nowrap}
.g{display:inline-flex;min-width:0;align-items:center;gap:3px;padding:0 5px 0 4px;border-radius:5px;background:hsl(var(--h) var(--s) 55% / .17);color:hsl(var(--h) var(--s) 76%)}
.g span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.g svg{width:12px;height:12px;flex:none;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
[data-theme=light] .g{background:hsl(var(--h) var(--s) 50% / .13);color:hsl(var(--h) var(--s) 32%)}
.ml{display:flex;align-items:center;gap:8px}
.ml>:first-child{min-width:0;display:flex}
.ml .tr{margin-left:auto;flex:none;white-space:nowrap}
.row.none{opacity:.45;pointer-events:none}
.msg{padding:40px 16px;text-align:center;color:var(--dim)}
dialog{border:0;padding:0;background:var(--bg);color:var(--fg);width:100%;max-width:760px;height:100%;max-height:100%;margin:0 auto;overscroll-behavior:contain;scrollbar-width:none}
dialog::-webkit-scrollbar{display:none}
dialog::backdrop{background:#000a}
dialog[open]{animation:push .3s cubic-bezier(.2,.8,.2,1)}
dialog[open]::backdrop{animation:fade .3s}
@keyframes push{from{transform:translateX(100%)}}
@keyframes fade{from{opacity:0}}
@media (prefers-reduced-motion:reduce){dialog[open],dialog[open]::backdrop,.days .now::before{animation:none}img.th,img.hero,.row{transition:none}}
@media (min-width:800px){dialog{height:auto;max-height:92vh;margin:4vh auto;border-radius:16px}}
.bar{position:sticky;top:0;z-index:1;display:flex;align-items:center;gap:8px;padding:calc(var(--top) + 8px) 8px 8px;background:var(--bg)}
.bar h2{font-size:18px;flex:1}
/* Detail im Streaming-Stil: Bild läuft in den Hintergrund aus, Titel steht im Bild. */
.hw{position:relative;background:var(--card) center/cover}
.hero{width:100%;aspect-ratio:16/10;object-fit:cover;display:block}
.hw::after{content:"";position:absolute;inset:0;background:linear-gradient(to bottom,#0007 0,transparent 20%,transparent 38%,var(--bg) 98%);pointer-events:none}
.ht{position:absolute;left:0;right:0;bottom:0;z-index:1;padding:0 16px 2px}
.ht h2{font-size:28px;line-height:1.12;font-weight:800;letter-spacing:-.3px;margin:6px 0 5px;text-wrap:balance;text-shadow:0 1px 14px #000a}
[data-theme=light] .ht h2{text-shadow:0 1px 12px #fffc}
.ht .m{font-size:13.5px}
.chn{display:flex;align-items:center;gap:8px}
.ht .lg{position:static;display:inline-flex;height:24px}
.ht .lg img{max-width:96px}
[data-theme=dark] .ht .ch{text-shadow:0 1px 6px #000c}
.ht .pg:not([hidden]){display:block}
.ht .pg{position:static;margin-top:10px;height:3px;border-radius:2px;background:var(--line)}
.hw.no{background:none;padding-top:calc(var(--top) + 52px)}
.hw.no::after{display:none}
.hw.no .ht{position:static}
.ch{font-size:11px;line-height:1.2;font-weight:700;text-transform:uppercase;letter-spacing:.4px;color:var(--acc)}
.dt{padding:10px 16px calc(env(safe-area-inset-bottom) + 28px)}
.dt .sub{color:var(--dim);font-weight:600;margin-bottom:8px}
.dt .m{margin:0 0 10px;font-size:13.5px}
.dt p{margin:0 0 10px;line-height:1.5}
.dt h3{font-size:13px;text-transform:uppercase;letter-spacing:.4px;color:var(--dim);margin:16px 0 6px}
.cast{display:flex;flex-wrap:wrap;gap:6px;padding:0;list-style:none}
.cast li{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:4px 9px;font-size:14px}
.cast small{color:var(--dim)}
.next{list-style:none;padding:0}
.next li{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);font-size:15px;cursor:pointer}
.next li span{flex:1}
.next li:active{opacity:.6}
.chev{width:8px;height:8px;border:solid var(--dim);border-width:2px 2px 0 0;transform:rotate(45deg);margin-right:6px}
.next b{font-variant-numeric:tabular-nums;color:var(--dim);font-weight:600}
.nt{flex:none;width:56px;aspect-ratio:16/9;border-radius:4px;background:var(--card);object-fit:cover}
.back{position:absolute;z-index:2;top:calc(var(--top) + 8px);left:8px;background:#000a;color:#fff}
.sec{padding:4px 12px 12px}
.sec h3{font-size:13px;text-transform:uppercase;letter-spacing:.4px;color:var(--dim);margin:14px 4px 6px}
.chl{list-style:none;padding:0}
.chl li{display:flex;align-items:center;gap:8px;padding:4px 4px 4px 8px;background:var(--card);border:1px solid var(--line);border-radius:10px;margin-bottom:6px;min-height:48px;touch-action:pan-y}
.chl li>span:not(.lg){flex:1}
.chl .lg{position:static;flex:none;width:52px;height:20px;justify-content:center}
.chl li.drag{opacity:.9;box-shadow:0 6px 20px #0008;position:relative;z-index:2}
.handle{touch-action:none;cursor:grab;color:var(--dim)}
.add li{cursor:pointer}
.add li::after{content:"+";font-size:22px;color:var(--acc);padding:0 12px}
input[type=search]{width:100%;font:inherit;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--fg);margin-bottom:8px}
.seg{display:flex;gap:2px;padding:3px;border-radius:99px;background:var(--card);border:1px solid var(--line)}
.seg button{flex:1;padding:8px 6px;border-radius:99px;font-size:14px;font-weight:500}
.seg [aria-checked=true]{background:var(--acc);color:#111;font-weight:600}
.reset{color:var(--dim);font-size:14px;text-decoration:underline;padding:8px 4px}
</style>

<body>
<div class="edge" aria-hidden="true"></div>
<main id="list"><p class="msg">Lade Programm …</p></main>
<footer class="tabs">
  <nav class="days" id="days"></nav>
  <button class="icon" id="gear" aria-label="Einstellungen"><svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/><circle cx="9" cy="6" r="2" fill="var(--bg)"/><circle cx="15" cy="12" r="2" fill="var(--bg)"/><circle cx="8" cy="18" r="2" fill="var(--bg)"/></svg></button>
</footer>

<dialog id="detail" autofocus></dialog>

<dialog id="settings" autofocus>
  <div class="bar"><button class="icon" data-close aria-label="Zurück"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button><h2>Einstellungen</h2></div>
  <div class="sec">
    <h3>Darstellung</h3>
    <div class="seg" id="theme" role="radiogroup" aria-label="Darstellung"><button role="radio" data-v="auto">Automatisch</button><button role="radio" data-v="light">Hell</button><button role="radio" data-v="dark">Dunkel</button></div>
    <h3>Meine Sender · zum Sortieren ziehen</h3>
    <ul class="chl" id="mine"></ul>
    <h3>Weitere Sender</h3>
    <input type="search" id="q" placeholder="Sender suchen …" autocomplete="off">
    <ul class="chl add" id="others"></ul>
    <button class="reset" id="reset">Auf Standard zurücksetzen</button>
  </div>
</dialog>

<script>
'use strict';
const DEFAULT = ['orf1','orf2','orfiii','servustv','atv','puls4','daserste','zdf','rtl','sat1','prosieben','vox','kabeleins','rtlzwei','3sat','arte'];
const KEY = 'tv.channels';
const NOW = 'jetzt';
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);

// Bilder kommen live: fairu skaliert selbst, alles andere (TV Spielfilm
// liefert bis zu 6 MB große Originale) über den Resize-Dienst wsrv.nl.
function live(src, w) {
  if (!src) return '';
  if (src.startsWith('files.fairu.app')) return `https://${src}?width=${w}&format=webp&quality=70`;
  const h = Math.round((w * 9) / 16);
  return `https://wsrv.nl/?url=${encodeURIComponent(src)}&w=${w}&h=${h}&fit=cover&a=attention&output=webp&q=65`;
}

let list = null;
let view = null; // NOW oder ein Datum (20:15-Ansicht)
let names = new Map();
let logos = new Map();
let shown = new Map(); // id -> Sendung der aktuellen Ansicht, für das Antippen
const details = new Map();
const scheds = new Map();
const schedX = new Map();

function loadMine() {
  try { const v = JSON.parse(localStorage.getItem(KEY)); if (Array.isArray(v)) return v; } catch {}
  return null;
}
let mine = loadMine();
const saveMine = () => localStorage.setItem(KEY, JSON.stringify(mine));
const localIso = (d = new Date()) => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
const hm = (ms) => new Date(ms).toTimeString().slice(0, 5);
const at = (date, time) => new Date(`${date}T${time}`).getTime();
const myChannels = () => mine.filter((id) => names.has(id));

function dayLabel(iso) {
  if (iso === NOW) return 'Jetzt';
  if (iso === localIso()) return 'Heute';
  const t = new Date(); t.setDate(t.getDate() + 1);
  if (iso === localIso(t)) return 'Morgen';
  return new Date(`${iso}T12:00`).toLocaleDateString('de-AT', { weekday: 'short', day: 'numeric', month: 'numeric' });
}

// Genre-Gruppen: Reihenfolge zählt ("Krimikomödie" ist Krimi, "Doku-Soap" Show).
// [Muster, Farbton, Sättigung, SVG-Pfad]
const GENRES = [
  [/kinder|zeichentrick|animation|anime|trick|jugend|familien|märchen|cartoon/, 85, '60%', '<path d="M12 3a5 5 0 0 1 5 5c0 3.5-3 6-5 6s-5-2.5-5-6a5 5 0 0 1 5-5zM12 14c0 2.5-2 3.5-1 7"/>'],
  [/sport|fußball|fussball|bundesliga|tennis|snooker|rugby|surf|motorrad|formel|biathlon|handball|boxen/, 135, '50%', '<circle cx="12" cy="12" r="9"/><path d="M12 7l4 3-1.5 4.5h-5L8 10z"/>'],
  [/soap|reality|casting|kuppel|dating/, 200, '65%', '<path d="M12 3l2.6 5.6 6 .6-4.5 4 1.3 6L12 16.2 6.6 19.2l1.3-6-4.5-4 6-.6z"/>'],
  [/krimi|thriller|crime|polizei|agent|anwalt|justiz|detektiv|gauner|cop/, 0, '65%', '<circle cx="10.5" cy="10.5" r="6"/><path d="M20 20l-5-5"/>'],
  [/doku|dokument|reportage|bericht|natur|geschicht|wissen|biograf|porträt|portrait|archaeolog|documentar|tier|reise|touris/, 165, '50%', '<circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3.5 3 14.5 0 18M12 3c-3 3.5-3 14.5 0 18"/>'],
  [/sci|fantasy|horror|mystery|übernatür|future/, 270, '55%', '<path d="M12 3v4M12 17v4M3 12h4M17 12h4M6 6l2.5 2.5M15.5 15.5L18 18M6 18l2.5-2.5M15.5 8.5L18 6"/>'],
  [/action|abenteuer|adventure|western|krieg|katastroph|pirat/, 25, '75%', '<path d="M13 3L5 14h6l-1 7 8-11h-6z"/>'],
  [/komödie|comedy|sitcom|klamauk|kabarett|satire|schwank|klamotte|comic|komedi|dramedy/, 48, '80%', '<circle cx="12" cy="12" r="9"/><path d="M8 14c1.2 1.6 2.5 2.3 4 2.3s2.8-.7 4-2.3M9 9.5h.01M15 9.5h.01"/>'],
  [/dram|liebe|romanz|romant|schmonzette|ärzte|arzt/, 330, '60%', '<path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"/>'],
  [/nachricht|news|notizie|haber|actualit|informa|politi|economy|wirtschaft|magazin|social/, 220, '25%', '<path d="M4 5h13v14H6a2 2 0 0 1-2-2zM17 9h3v8a2 2 0 0 1-2 2M7 9h7M7 13h7M7 16h4"/>'],
  [/show|quiz|musik|music|konzert|pop|jazz|schlager|talk|gespräch|koch|kulinar|unterhalt|spiel|musical/, 200, '65%', '<path d="M12 3l2.6 5.6 6 .6-4.5 4 1.3 6L12 16.2 6.6 19.2l1.3-6-4.5-4 6-.6z"/>'],
  [/film|movie/, 35, '20%', '<rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 9h18M7 5l2 4M12 5l2 4M17 5l2 4"/>'],
];
function genreChip(genre) {
  const g = genre.toLowerCase();
  const hit = GENRES.find(([re]) => re.test(g));
  if (!hit) return esc(genre);
  return `<span class="g" style="--h:${hit[1]};--s:${hit[2]}"><svg viewBox="0 0 24 24">${hit[3]}</svg><span>${esc(genre)}</span></span>`;
}

// Senderlogo transparent auf dem Bild; ohne Logo der Name als Textbadge.
function channelMark(id) {
  const name = esc(names.get(id));
  const l = logos.get(id);
  return l ? `<span class="lg ${l}"><img src="img/logo-${id}.webp" alt="${name}"></span>` : `<span class="badge">${name}</span>`;
}

// ---- Sendungen: ein Format für beide Ansichten --------------------------------
// { id, title, genre, year, rating, s, e (ms), start, stop (HH:MM), th, hero, x(), next }

function item2015(date, id) {
  const it = list.items[date]?.[id];
  if (!it) return null;
  const [title, start, stop, genre, year, src, rating] = it;
  const s = at(date, start);
  let e = at(date, stop);
  if (e <= s) e += 864e5;
  return {
    id, title, genre, year, rating, s, e, start, stop,
    th: live(src, 320), hero: live(src, 960), live: true,
    x: () => getDetails(date, id),
    next: () => getSched(date, id).then((progs) => {
      const base = at(date, '00:00');
      const j = progs.findIndex((p) => base + p[0] * 6e4 >= e);
      return j < 0 ? [] : progs.slice(j, j + 3).map((q, k) => schedItem(date, id, progs, j + k));
    }),
  };
}

function getJson(cache, url, fallback) {
  if (!cache.has(url)) cache.set(url, fetch(url).then((r) => (r.ok ? r.json() : fallback)).catch(() => { cache.delete(url); return fallback; }));
  return cache.get(url);
}
const getDetails = (date, id) => getJson(details, `data/${date}/${id}.d.json`, {});
const getSched = (date, id) => getJson(scheds, `data/${date}/${id}.json`, []);
const getSchedX = (date, id) => getJson(schedX, `data/${date}/${id}.x.json`, []);

// Programm eines Tages: Zeiten sind Minuten ab 0 Uhr dieses Tages.
function schedItem(date, id, progs, j) {
  const p = progs[j];
  const base = at(date, '00:00');
  const s = base + p[0] * 6e4;
  const e = base + p[1] * 6e4;
  return {
    id, title: p[2], genre: p[3], year: p[5], rating: p[6], s, e, start: hm(s), stop: hm(e),
    th: live(p[4], 320), hero: live(p[4], 960), sm: live(p[4], 160), live: true,
    x: () => getSchedX(date, id).then((x) => x[j] || {}),
    // erst beim Öffnen gebaut: jede Sendung hat ihr eigenes "Danach"
    next: () => progs.slice(j + 1, j + 4).map((q, k) => schedItem(date, id, progs, j + 1 + k)),
  };
}

function itemNow(date, id, progs, t = Date.now()) {
  const base = at(date, '00:00');
  const i = progs.findIndex((p) => base + p[0] * 6e4 <= t && t < base + p[1] * 6e4);
  return i < 0 ? null : schedItem(date, id, progs, i);
}

// ---- Liste ---------------------------------------------------------------------
const mins = (a, b) => Math.round((b - a) / 6e4);

function rightText(it) {
  if (view === NOW) return `noch <span class="rem">${Math.max(1, mins(Date.now(), it.e))}</span> Min · bis ${it.stop}`;
  const since = it.start === '20:15' ? '' : `seit ${it.start} · `;
  return `${since}${mins(it.s, it.e)} Min · bis ${it.stop}`;
}

const progressBar = (it) => `<span class="pg" data-s="${it.s}" data-e="${it.e}" hidden><i></i></span>`;

function rowHtml(id, it, i) {
  const mark = channelMark(id);
  if (!it) return `<div class="row none"><div class="tw"><div class="th"></div>${mark}</div><div><span class="t">Keine Daten</span></div></div>`;
  const prio = i < 6 ? 'fetchpriority="high"' : 'loading="lazy"';
  const cors = it.live ? ' crossorigin="anonymous"' : '';
  const th = it.th ? `<img class="th" src="${it.th}" ${prio}${cors} decoding="async" width="320" height="180" alt="">` : '<div class="th"></div>';
  const scrim = logos.get(id) === 'w' ? ' sc' : '';
  return `<button class="row" data-id="${id}"><div class="tw${scrim}">${th}${mark}</div>${progressBar(it)}`
    + `<div><span class="t">${esc(it.title)}</span><span class="m ml"><span>${it.genre ? genreChip(it.genre) : ''}</span><span class="tr">${rightText(it)}</span></span></div></button>`;
}

function updateProgress() {
  const t = Date.now();
  for (const el of document.querySelectorAll('.pg')) {
    const p = (t - el.dataset.s) / (el.dataset.e - el.dataset.s);
    el.hidden = !(p > 0 && p < 1);
    if (!el.hidden) el.firstChild.style.width = `${(p * 100).toFixed(1)}%`;
  }
  for (const el of document.querySelectorAll('.rem')) {
    const e = shown.get(el.closest('.row')?.dataset.id)?.e;
    if (e) el.textContent = Math.max(1, mins(t, e));
  }
}

function settleImages(root) {
  for (const im of root.querySelectorAll('img.th,img.hero')) if (im.complete && im.naturalWidth) im.classList.add('ok');
}
document.addEventListener('load', (e) => { if (e.target.tagName === 'IMG') e.target.classList.add('ok'); }, true);

let renderToken = 0;
async function renderList() {
  const token = ++renderToken;
  const ids = myChannels();
  let items;
  if (view === NOW) {
    const today = localIso();
    const all = await Promise.all(ids.map((id) => getSched(today, id)));
    if (token !== renderToken) return;
    items = ids.map((id, k) => itemNow(today, id, all[k]));
  } else {
    items = ids.map((id) => item2015(view, id));
  }
  shown = new Map(ids.map((id, k) => [id, items[k]]));
  const el = $('#list');
  el.innerHTML = ids.length ? ids.map((id, k) => rowHtml(id, items[k], k)).join('') : '<p class="msg">Keine Sender ausgewählt.</p>';
  settleImages(el);
  updateProgress();
}

function views() {
  const today = localIso();
  const days = list.days.filter((d) => d >= today);
  return [NOW, ...(days.length ? days : list.days.slice(-1))];
}

function renderDays() {
  const vs = views();
  if (!vs.includes(view)) view = vs[1] ?? NOW;
  $('#days').innerHTML = vs.map((d) => `<button data-day="${d}" class="${d === NOW ? 'now' : ''}" aria-pressed="${d === view}">${dayLabel(d)}</button>`).join('');
  $('#days [aria-pressed=true]')?.scrollIntoView({ inline: 'nearest', block: 'nearest' });
}

function render() { renderDays(); return renderList(); }

// Ansicht wechseln, mit kurzer Schiebe-Animation in Wischrichtung.
const reduce = matchMedia('(prefers-reduced-motion: reduce)');
async function goView(v) {
  const vs = views();
  const dir = Math.sign(vs.indexOf(v) - vs.indexOf(view));
  if (!dir) return;
  view = v;
  const el = $('#list');
  if (reduce.matches || !el.animate) { await render(); el.scrollTop = 0; return; }
  renderDays();
  await el.animate([{ transform: 'none', opacity: 1 }, { transform: `translateX(${-dir * 40}px)`, opacity: 0 }], { duration: 110, easing: 'ease-in' }).finished;
  await renderList();
  el.scrollTop = 0;
  el.animate([{ transform: `translateX(${dir * 40}px)`, opacity: 0 }, { transform: 'none', opacity: 1 }], { duration: 170, easing: 'ease-out' });
}

// Waagrecht wischen. Nicht vom Rand aus: das ist die Zurück-Geste des Systems.
function onSwipe(el, fn) {
  let touch = null;
  el.addEventListener('touchstart', (e) => {
    const t = e.touches[0];
    touch = t.clientX < 24 || t.clientX > innerWidth - 24 ? null : { x: t.clientX, y: t.clientY, at: Date.now() };
  }, { passive: true });
  el.addEventListener('touchend', (e) => {
    if (!touch || Date.now() - touch.at > 600) return;
    const t = e.changedTouches[0];
    const dx = t.clientX - touch.x;
    const dy = t.clientY - touch.y;
    touch = null;
    if (Math.abs(dx) >= 60 && Math.abs(dx) >= 2 * Math.abs(dy)) fn(dx < 0 ? 1 : -1);
  }, { passive: true });
}

// Zwischen den Ansichten wischen.
onSwipe($('#list'), (dir) => {
  const vs = views();
  const next = vs[vs.indexOf(view) + dir];
  if (next) goView(next);
});

async function getList() {
  const res = await fetch('data/list.json');
  if (!res.ok) throw new Error(res.status);
  return res.json();
}

function applyList(l) {
  if (list && l.built === list.built) return;
  list = l;
  names = new Map(l.channels.map((c) => [c[0], c[1]]));
  logos = new Map(l.channels.filter((c) => c[2]).map((c) => [c[0], c[2]]));
  if (!mine) mine = DEFAULT.filter((id) => names.has(id));
  render();
}

// ---- Detailansicht ---------------------------------------------------------
const dlg = $('#detail');
const backBtn = '<button class="icon back" data-close aria-label="Zurück"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>';

function meta(it) {
  const bits = [];
  if (it.genre) bits.push(genreChip(it.genre));
  bits.push(`${mins(it.s, it.e)} Min`);
  bits.push(`${it.start}–${it.stop}`);
  if (it.year) bits.push(it.year);
  if (it.rating) bits.push(`★ ${String(it.rating).replace('.', ',')}`);
  return bits.map((b) => `<span class="nw">${b}</span>`).join(' · ');
}

const COUNTRY = { D: 'Deutschland', A: 'Österreich', CH: 'Schweiz', GB: 'Großbritannien', F: 'Frankreich', I: 'Italien', E: 'Spanien' };

// Verlauf innerhalb der Detailansicht ("Danach" -> Sendung -> …), damit
// Zurück schrittweise zurückgeht und erst am Anfang schließt.
const trail = [];
let current = null;

// dir: 0 = aus der Liste, 1 = weiter zu "Danach", -1 = zurück
async function openDetail(it, dir = 0) {
  if (!it) return;
  const id = it.id;
  current = it;
  const cors = it.live ? ' crossorigin="anonymous"' : '';
  const hero = it.hero ? `<img class="hero" src="${it.hero}"${cors} alt="">` : '';
  const bg = it.th ? ` style="background-image:url('${it.th}')"` : '';
  // Name immer auch als Text: manche Logos (z. B. ARD alpha) erkennt man nicht.
  const mark = `<div class="chn">${logos.has(id) ? channelMark(id) : ''}<span class="ch">${esc(names.get(id))}</span></div>`;
  dlg.innerHTML = `<div class="hw${hero ? '' : ' no'}"${bg}>${hero}<div class="ht">${mark}<h2>${esc(it.title)}</h2><div class="m">${meta(it)}</div>${progressBar(it)}</div></div>${backBtn}<div class="dt"><div id="dx"></div></div>`;
  settleImages(dlg);
  updateProgress();
  if (!dlg.open) { dlg.showModal(); history.pushState({ d: 1 }, ''); }
  else if (dir && !reduce.matches && Date.now() - edgeSwipe > 1500) {
    dlg.animate([{ transform: `translateX(${dir * 35}%)`, opacity: 0.4 }, { transform: 'none', opacity: 1 }], { duration: 260, easing: 'cubic-bezier(.2,.8,.2,1)' });
  }
  dlg.scrollTop = 0;
  const [x, next] = await Promise.all([
    it.x().catch(() => ({})),
    Promise.resolve(it.nextList ?? it.next?.() ?? []).catch(() => []),
  ]);
  const dx = $('#dx');
  if (!dlg.open || !dx || current !== it) return;
  const extra = [x.ep, COUNTRY[x.country] ?? x.country].filter(Boolean).map(esc);
  let body = x.sub ? `<div class="sub">${esc(x.sub)}</div>` : '';
  if (extra.length) body += `<div class="m">${extra.join(' · ')}</div>`;
  if (x.desc) body += x.desc.split(/\n+/).map((p) => `<p>${esc(p)}</p>`).join('');
  if (x.cast) body += `<h3>Besetzung</h3><ul class="cast">${x.cast.map((a) => `<li>${esc(a.n)}${a.r ? ` <small>${esc(a.r)}</small>` : ''}</li>`).join('')}</ul>`;
  if (x.dir) body += `<h3>Regie</h3><p>${x.dir.map(esc).join(', ')}</p>`;
  it.nextList = next;
  const small = (n) => (n.sm ? `<img class="nt" src="${n.sm}" loading="lazy" decoding="async" alt="">` : '<span class="nt"></span>');
  if (it.nextList.length) body += `<h3>Danach</h3><ul class="next">${it.nextList.map((n, k) => `<li data-k="${k}"><b>${n.start}</b>${small(n)}<span>${esc(n.title)}</span><i class="chev"></i></li>`).join('')}</ul>`;
  dx.innerHTML = body;
}

// Zurück schiebt die Ansicht nach rechts hinaus. Nicht bei Safaris Wischgeste
// vom linken Rand: die animiert schon selbst, sonst liefe es doppelt.
let edgeSwipe = 0;
addEventListener('touchstart', (e) => { if (e.touches[0].clientX < 30) edgeSwipe = Date.now(); }, { passive: true });
const EASE_OUT = { duration: 250, easing: 'cubic-bezier(.4,0,.8,.2)' };
function closeDialogs() {
  for (const d of document.querySelectorAll('dialog[open]')) {
    if (reduce.matches || Date.now() - edgeSwipe < 1500 || !d.animate) { d.close(); continue; }
    d.animate([{ transform: 'none' }, { transform: 'translateX(100%)' }], EASE_OUT).finished.then(() => d.close());
    try { d.animate([{ opacity: 1 }, { opacity: 0 }], { ...EASE_OUT, pseudoElement: '::backdrop' }); } catch {}
  }
}
addEventListener('popstate', () => {
  if (dlg.open && trail.length) openDetail(trail.pop(), -1);
  else closeDialogs();
});
dlg.addEventListener('click', (e) => {
  const li = e.target.closest('.next li[data-k]');
  if (!li || !current) return;
  trail.push(current);
  history.pushState({ d: trail.length + 1 }, '');
  openDetail(current.nextList[li.dataset.k], 1);
});
dlg.addEventListener('close', () => { trail.length = 0; });
// In der Detailseite nach rechts wischen: zurück.
onSwipe(dlg, (dir) => { if (dir < 0) history.back(); });
for (const d of document.querySelectorAll('dialog')) {
  d.addEventListener('click', (e) => { if (e.target === d || e.target.closest('[data-close]')) history.back(); });
  d.addEventListener('cancel', (e) => { e.preventDefault(); history.back(); });
  d.addEventListener('close', () => { if (d.id === 'settings') renderList(); });
}

$('#list').addEventListener('click', (e) => {
  const row = e.target.closest('.row[data-id]');
  if (row) openDetail(shown.get(row.dataset.id));
});
$('#days').addEventListener('click', (e) => {
  const b = e.target.closest('button');
  if (b) goView(b.dataset.day);
});

// ---- Darstellung -------------------------------------------------------------
function renderTheme(pref) {
  for (const b of $('#theme').children) b.setAttribute('aria-checked', b.dataset.v === pref);
}
renderTheme(applyTheme());
$('#theme').addEventListener('click', (e) => {
  const v = e.target.closest('button')?.dataset.v;
  if (!v) return;
  try { localStorage.setItem('tv.theme', v); } catch {}
  renderTheme(applyTheme());
});

// ---- Senderauswahl ---------------------------------------------------------
const set = $('#settings');
const handleSvg = '<svg viewBox="0 0 24 24"><path d="M5 9h14M5 15h14"/></svg>';
const smallMark = (id) => logos.has(id) ? `<span class="lg ${logos.get(id)}"><img src="img/logo-${id}.webp" alt="" loading="lazy"></span>` : '<span class="lg no"></span>';
function renderSettings() {
  $('#mine').innerHTML = myChannels().map((id) =>
    `<li data-id="${id}">${smallMark(id)}<span>${esc(names.get(id))}</span><button class="icon rm" aria-label="Entfernen"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button><button class="icon handle" aria-label="Verschieben">${handleSvg}</button></li>`).join('');
  renderOthers();
}
function renderOthers() {
  const q = $('#q').value.trim().toLowerCase();
  const taken = new Set(mine);
  $('#others').innerHTML = list.channels
    .filter(([id, n]) => !taken.has(id) && (!q || n.toLowerCase().includes(q)))
    .map(([id, n]) => `<li data-id="${id}">${smallMark(id)}<span>${esc(n)}</span></li>`).join('');
}
$('#gear').addEventListener('click', () => {
  if (!list) return;
  $('#q').value = '';
  renderSettings();
  set.showModal();
  history.pushState({ s: 1 }, '');
});
$('#q').addEventListener('input', renderOthers);

$('#others').addEventListener('click', (e) => {
  const li = e.target.closest('li');
  if (!li) return;
  mine.push(li.dataset.id);
  saveMine();
  renderSettings();
});
$('#mine').addEventListener('click', (e) => {
  if (!e.target.closest('.rm')) return;
  const id = e.target.closest('li').dataset.id;
  mine = mine.filter((x) => x !== id);
  saveMine();
  renderSettings();
});
$('#reset').addEventListener('click', () => {
  mine = DEFAULT.filter((id) => names.has(id));
  saveMine();
  renderSettings();
});

// Ziehen am Griff: das Element folgt dem Finger, Nachbarn rücken nach.
$('#mine').addEventListener('pointerdown', (e) => {
  const h = e.target.closest('.handle');
  if (!h) return;
  e.preventDefault();
  const li = h.closest('li');
  const ul = li.parentElement;
  li.classList.add('drag');
  h.setPointerCapture(e.pointerId);
  let startY = e.clientY;
  const move = (ev) => {
    li.style.transform = `translateY(${ev.clientY - startY}px)`;
    const prev = li.previousElementSibling;
    const next = li.nextElementSibling;
    const r = li.getBoundingClientRect();
    const mid = r.top + r.height / 2;
    if (prev && mid < prev.getBoundingClientRect().top + prev.offsetHeight / 2) {
      ul.insertBefore(li, prev);
      startY -= prev.offsetHeight + 6;
    } else if (next && mid > next.getBoundingClientRect().top + next.offsetHeight / 2) {
      ul.insertBefore(next, li);
      startY += next.offsetHeight + 6;
    } else return;
    li.style.transform = `translateY(${ev.clientY - startY}px)`;
  };
  const up = () => {
    h.removeEventListener('pointermove', move);
    li.classList.remove('drag');
    li.style.transform = '';
    const order = [...ul.children].map((x) => x.dataset.id);
    mine = [...order, ...mine.filter((id) => !order.includes(id))];
    saveMine();
  };
  h.addEventListener('pointermove', move);
  h.addEventListener('pointerup', up, { once: true });
  h.addEventListener('pointercancel', up, { once: true });
});

// Wie eine App: kein Pinch-Zoom. iOS ignoriert user-scalable=no im Browser.
for (const ev of ['gesturestart', 'gesturechange']) document.addEventListener(ev, (e) => e.preventDefault());

// ---- Start -----------------------------------------------------------------
async function refresh() {
  try { applyList(await getList()); }
  catch { if (!list) $('#list').innerHTML = '<p class="msg">Programm konnte nicht geladen werden.</p>'; }
}

// Im Leerlauf vorladen, was die eigenen Sender brauchen (gesamt unter 1 MB):
// zuerst die kleinen Daten (Details, Tagesprogramme für "Danach" und "Jetzt"),
// dann die Vorschaubilder aller Tage und von "Jetzt". Danach geht Wechseln
// und Antippen ohne Netz; nur die großen Bilder kommen erst beim Öffnen.
function prefetch() {
  if (!list || navigator.connection?.saveData) return;
  const today = localIso();
  const ids = myChannels();
  const seen = new Set();
  const img = (url) => { if (url && !seen.has(url)) { seen.add(url); fetch(url, { mode: 'cors', priority: 'low' }).catch(() => {}); } };
  for (const d of list.days) for (const id of ids) {
    if (list.items[d]?.[id]) getDetails(d, id);
    if (d !== today) getSched(d, id);
  }
  for (const id of ids) getSchedX(today, id);
  for (const d of list.days) for (const id of ids) img(live(list.items[d]?.[id]?.[5], 320));
  for (const id of ids) getSched(today, id).then((progs) => img(itemNow(today, id, progs)?.th));
}

// Fortschritt und "noch x Min" laufen mit; in "Jetzt" rückt nach dem Ende
// einer Sendung die nächste nach.
setInterval(() => {
  if (document.visibilityState !== 'visible' || !list) return;
  if (view === NOW && [...shown.values()].some((it) => it && it.e <= Date.now())) renderList();
  else updateProgress();
}, 20000);

// iOS entscheidet beim Start (oft zu früh), ob oben der Weichzeichner liegt,
// und prüft neu erst, wenn das Dokument selbst scrollt. Unseres scrollt nie
// (nur die Liste), deshalb war es erst nach der Zurück-Geste scharf. Also
// einmal unsichtbar 1 px scrollen: dafür muss das Dokument kurz scrollbar sein.
function nudgeTopEdge() {
  const r = document.documentElement;
  r.style.overflow = 'auto';
  r.style.height = 'calc(100% + 1px)';
  scrollTo(0, 1);
  requestAnimationFrame(() => requestAnimationFrame(() => {
    scrollTo(0, 0);
    r.style.overflow = r.style.height = '';
  }));
}
addEventListener('pageshow', () => requestAnimationFrame(nudgeTopEdge));

refresh().then(() => {
  requestAnimationFrame(nudgeTopEdge);
  (window.requestIdleCallback || setTimeout)(prefetch, { timeout: 3000 });
});
addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible' && list) { render(); refresh(); nudgeTopEdge(); }
});
if ('serviceWorker' in navigator) {
  const sw = navigator.serviceWorker;
  const reg = sw.register('sw.js');
  sw.addEventListener('message', (e) => { if (e.data === 'list') refresh(); });
  // Installierte Apps bleiben im Speicher und laden beim Wiederöffnen nicht
  // neu – also selbst nach einer neuen Version fragen und dann einmal neu laden.
  // Nicht beim allerersten Besuch: da übernimmt der Worker nur erstmals.
  const hadController = !!sw.controller;
  sw.addEventListener('controllerchange', () => { if (hadController) location.reload(); });
  addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible') reg.then((r) => r.update()).catch(() => {});
  });
}
</script>
